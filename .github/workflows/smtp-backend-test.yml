name: Telegram application backend test

on:
  push:
    branches: [main]
    paths:
      - "api/submit-application.php"
      - "tools/php-handler-contract.test.mjs"
      - "package.json"
      - ".github/workflows/smtp-backend-test.yml"
  pull_request:
    paths:
      - "api/submit-application.php"
      - "tools/php-handler-contract.test.mjs"
      - "package.json"
      - ".github/workflows/smtp-backend-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-backend-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-production-handler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install PHP command-line runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes php-cli
      - name: Check PHP syntax
        run: php -l api/submit-application.php
      - name: Check the production Telegram contract
        run: npm run test:backend
